name: Supabase Keep Alive Ping

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutar el ping manualmente desde la web de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
    - name: Hacer petición HTTP a Supabase
      run: |
        curl -X GET "${{ secrets.SUPABASE_URL }}" \
        -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
        -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
