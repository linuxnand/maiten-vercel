<!DOCTYPE html>
<html lang="es">
<head>
    <head>
    <meta property="og:title" content="Pavimento El Maitén">
    <meta property="og:description" content="Pavimento El Maitén">
    <meta property="og:image" content="https://maiten-vercel.vercel.app/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="darkreader-lock">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavimento El Maitén</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── STICKY HEADER ── */
        #header {
            flex-shrink: 0;
            background: #000000;
            color: white;
            text-align: center;
            padding: 10px 12px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }
        #header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #e0e0e0;
        }
        #stats {
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .stat-si  { color: #2ecc71; }
        .stat-no  { color: #ff4136; }
        .stat-nc  { color: #c8d0d8; }
        .stat-val { color: white; font-size: 0.95rem; }
        .stat-pct { color: white; font-size: 0.95rem; }

        /* ── MAP AREA ── */
        #map-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #ffffff;
            cursor: grab;
        }
        #map-container.grabbing { cursor: grabbing; }
        #map-inner {
            transform-origin: 0 0;
            position: absolute;
            top: 0; left: 0;
        }
        svg { display: block; }
        path {
            cursor: pointer;
            transition: fill 0.15s ease;
            stroke: #333;
            stroke-width: 0.5px;
        }
        path:hover { opacity: 0.75; }
        path.lote-highlight { filter: brightness(1.6) !important; }
        .lote-si { fill: #2ecc71 !important; }
        .lote-no { fill: #ff4136 !important; }
        .lote-nc { fill: #c8d0d8 !important; }

        /* Lote resaltado desde historial */
        @keyframes lote-pulse {
            0%   { filter: drop-shadow(0 0 0px #f5c400); }
            50%  { filter: drop-shadow(0 0 14px #f5c400) brightness(1.8); }
            100% { filter: drop-shadow(0 0 0px #f5c400); }
        }
        path.lote-from-historial {
            stroke: #f5c400 !important;
            stroke-width: 0.5px !important;
            animation: lote-pulse 1.2s ease-in-out 3;
        }

        /* Banner de referencia */
        #lote-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f5c400;
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            white-space: nowrap;
            cursor: pointer;
        }

        /* ── TOOLTIP ── */
        #tooltip {
            display: none;
            position: fixed;
            background: #000;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.5;
            pointer-events: none;
            z-index: 999;
            width: max-content;
            max-width: 264px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* ── TOOLTIP MÓVIL ── */
        #tooltip.mobile-tip {
            pointer-events: auto;
            max-width: 260px;
            width: 260px;
            white-space: normal;
        }
        #tooltip.mobile-tip:not(:has(.tip-edit-btn:hover)) {
            /* allow taps on tooltip area to propagate for closing */
        }
        #tooltip .tip-edit-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 6px 0;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
            text-align: center;
            cursor: pointer;
        }
        #tooltip .tip-edit-btn:active { background: #555; }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #2b2b3b;
            padding: 22px 20px 18px;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
        }
        /* Labels: 10% bigger + lighter for contrast */
        .field-label {
            font-size: 0.97rem;   /* ~10% bigger than 0.88 */
            color: #c0c4d8;       /* lighter than before */
            margin-bottom: 5px;
            margin-top: 12px;
            font-weight: 500;
        }
        .field-label:first-child { margin-top: 0; }

        input {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: #3a3a4e;
            color: white;
        }
        input::placeholder { color: #666; }

        .field-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .field-row input {
            flex: 1;
            min-width: 0;
            width: auto;
        }
        .btn-whatsapp {
            flex: 0 0 42px;
            width: 42px;
            border: none;
            border-radius: 8px;
            background: #25D366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-whatsapp:active { background: #1ebc59; }

        .select-wrap {
            position: relative;
            margin-top: 0;
        }
        .select-wrap select {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: #3a3a4e;
            color: white;
            appearance: none;
            cursor: pointer;
        }
        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
        }

        .btns-bottom {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btns-bottom button {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        .btn-guardar { background: #2ecc71; color: white; }
        .btn-cancel  { background: #3a4a5e; color: #ccc; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Pavimento El Maitén</h1>
        <div id="stats">Cargando...</div>
    </div>

    <div id="map-container">
        <div id="map-inner"></div>
    </div>

    <div id="lote-banner" onclick="this.style.display='none'"></div>

    <div id="tooltip"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="field-label">Nombre</div>
            <input type="text" id="nombre" placeholder="Nombre y Apellido">

            <div class="field-label">Dirección</div>
            <input type="text" id="direccion" placeholder="Calle y número">

            <div class="field-label">Teléfono</div>
            <div class="field-row">
                <input type="tel" id="telefono" placeholder="Teléfono">
                <button type="button" class="btn-whatsapp" id="btn-whatsapp" onclick="abrirWhatsapp()" title="Abrir WhatsApp" aria-label="Abrir WhatsApp">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.79.47 3.53 1.36 5.07L2.05 22l5.16-1.35a9.9 9.9 0 0 0 4.83 1.23h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2Zm5.79 14.13c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.08.29-3.62-.76-3.05-1.27-5.02-4.37-5.17-4.57-.15-.2-1.24-1.65-1.24-3.15s.78-2.23 1.06-2.54c.27-.3.6-.38.8-.38.2 0 .4 0 .58.01.19.01.44-.07.68.53.24.6.83 2.06.9 2.21.07.15.12.33.02.53-.1.2-.15.33-.3.5-.15.18-.31.4-.44.53-.15.15-.3.31-.13.6.17.3.76 1.26 1.63 2.04 1.12 1 2.06 1.31 2.36 1.46.3.15.48.13.66-.08.18-.2.75-.87.95-1.17.2-.3.4-.24.66-.15.27.1 1.72.81 2.01.96.3.15.49.22.56.35.08.13.08.73-.16 1.41Z"/>
                    </svg>
                </button>
            </div>

            <div class="field-label">¿Quiere pavimento?</div>
            <div class="select-wrap">
                <select id="voto-select">
                    <option value="NC">Sin respuesta</option>
                    <option value="SI">Sí</option>
                    <option value="NO">No</option>
                </select>
            </div>

            <div class="btns-bottom">
                <button class="btn-guardar" onclick="guardar()">💾 Guardar</button>
                <button class="btn-cancel"  onclick="cerrarModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://jhevntzswmuwxpcqvdje.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZXZudHpzd211d3hwY3F2ZGplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNTE0NzAsImV4cCI6MjA4NjkyNzQ3MH0.i4Xn1TA9knS1a_3_3AoTrobfEg549kBf7iSK9E4Pj3g';
        const _supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let seleccionado = null;

        // Auto-refresh cada 5 segundos (solo si el modal está cerrado)
        setInterval(() => {
            if (document.getElementById('modal').style.display !== 'flex') {
                cargarVotos();
            }
        }, 5000);



        // ── LOAD SVG ─────────────────────────────────────────────────
        fetch('mapa.svg')
            .then(r => { if (!r.ok) throw new Error("No se pudo cargar mapa.svg."); return r.text(); })
            .then(svgText => {
                const inner = document.getElementById('map-inner');
                inner.innerHTML = svgText;
                const svg = inner.querySelector('svg');
                if (svg) {
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                    svg.style.display = 'block';

                }
                // Fade the background JPEG so path colors stay true
                const imgEl = svg.querySelector('image');
                if (imgEl) {
                    // Insert white rect behind the JPEG so street gaps appear white
                    const whiteRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    whiteRect.setAttribute('x', '0');
                    whiteRect.setAttribute('y', '0');
                    whiteRect.setAttribute('width', imgEl.getAttribute('width') || '100%');
                    whiteRect.setAttribute('height', imgEl.getAttribute('height') || '100%');
                    whiteRect.setAttribute('fill', '#ffffff');
                    imgEl.parentNode.insertBefore(whiteRect, imgEl);
                    // Fade JPEG so path colors are accurate but satellite context remains
                    imgEl.style.opacity = '1';
                }

                // Set gray fill on all paths immediately (they are transparent by default)
                inner.querySelectorAll('path').forEach(p => {
                    p.style.fill = '#c8d0d8';
                    p.style.fillOpacity = '1';
                });
                escucharClicks();
                cargarVotos().then(() => {
                    // ── Resaltar lote si viene de historial ──
                    const params = new URLSearchParams(window.location.search);
                    const loteParam = params.get('lote');
                    if (loteParam) {
                        destacarLoteDesdeHistorial(loteParam);
                    }
                });
                initZoom();
            })
            .catch(err => { document.getElementById('stats').innerText = '❌ ' + err.message; });

        // ── LOAD VOTES ────────────────────────────────────────────────
        async function cargarVotos() {
            const { data, error } = await _supabase.from('votos').select('*');
            if (error) { console.error(error); return; }

            let si = 0, no = 0, nc = 0;

            // Construir mapa de colores ANTES de tocar el DOM
            // así cada path se pinta una sola vez con su color final
            const colorMap = new Map();
            window._votosData = {};  // cache for tooltip
            data.forEach(item => {
                const v = (item.voto || '').toUpperCase();
                if (v === 'SI')      { colorMap.set(item.lote_id, '#2ecc71'); si++; }
                else if (v === 'NO') { colorMap.set(item.lote_id, '#ff4136'); no++; }
                else                 { colorMap.set(item.lote_id, '#c8d0d8'); nc++; }
                window._votosData[item.lote_id] = item;
            });

            // Una sola pasada por el DOM: cada path recibe su color final directo
            document.querySelectorAll('#map-inner path').forEach(p => {
                p.style.fill = colorMap.get(p.id) || '#c8d0d8';
                p.style.fillOpacity = '1';
                p.style.opacity = '1';         // override any inherited group opacity
                p.removeAttribute('opacity');  // remove SVG presentation opacity if any
                if (!colorMap.has(p.id)) nc++;
            });

            const total = si + no;
            const pctSi = total ? Math.round(si / total * 100) : 0;
            const pctNo = total ? Math.round(no / total * 100) : 0;

            document.getElementById('stats').innerHTML =
                `<span class="stat-si">SÍ: <span class="stat-val">${si} <span class="stat-pct">(${pctSi}%)</span></span></span>` +
                `<span class="stat-no">NO: <span class="stat-val">${no} <span class="stat-pct">(${pctNo}%)</span></span></span>` +
                `<span class="stat-nc">NC: <span class="stat-val">${nc}</span></span>`;
        }

        // ── CLICKS ON PATHS ──────────────────────────────────────────
        // KEY FIX: attach click on paths ONLY. Pan system uses pointerdown/move/up
        // on the container but does NOT call setPointerCapture on the SVG paths,
        // so native click events still fire on them after a clean tap.
        let _hlPath = null;

        function highlightPath(p) {
            if (_hlPath && _hlPath !== p) _hlPath.classList.remove('lote-highlight');
            _hlPath = p;
            p.classList.add('lote-highlight');
        }

        function restoreHighlight() {
            if (_hlPath) _hlPath.classList.remove('lote-highlight');
            _hlPath = null;
        }

        function escucharClicks() {
            // ── Cerrar tooltip móvil al tocar cualquier parte fuera del tooltip ──
            document.addEventListener('click', (e) => {
                if (window._panMoved > 12) return;
                const tip = document.getElementById('tooltip');
                if (!tip.classList.contains('mobile-tip')) return;
                // Si el toque fue dentro del tooltip, no cerrar
                if (tip.contains(e.target)) return;
                // Si el toque fue en un path, el handler del path lo maneja
                if (e.target.tagName === 'path') return;
                tip.style.display = 'none';
                tip.classList.remove('mobile-tip');
                restoreHighlight();
            }, true); // capture phase para que llegue antes del stopPropagation
            document.querySelectorAll('#map-inner path').forEach(p => {

                // Tooltip on hover (PC only — skip all mouse events on touch screens)
                p.addEventListener('mouseenter', () => {
                    if (window.matchMedia('(pointer: coarse)').matches) return;
                    const tip = document.getElementById('tooltip');
                    const data = window._votosData && window._votosData[p.id];
                    const v = data ? (data.voto || '').toUpperCase() : '';
                    const estado = v === 'SI' ? '🟢 SÍ quiere pavimento' : v === 'NO' ? '🔴 NO quiere pavimento' : '⚪ Sin respuesta';
                    tip.innerHTML =
                        'Nombre: <b>' + (data && data.nombre || '—') + '</b><br>' +
                        'Dirección: <b>' + (data && data.direccion || '—') + '</b><br>' +
                        'Teléfono: <b>' + (data && data.telefono || '—') + '</b><br>' +
                        estado;
                    tip.style.display = 'block';
                });

                p.addEventListener('mousemove', (e) => {
                    if (window.matchMedia('(pointer: coarse)').matches) return;
                    const tip = document.getElementById('tooltip');
                    const x = e.clientX + 14, y = e.clientY + 14;
                    const tw = tip.offsetWidth, th = tip.offsetHeight;
                    tip.style.left = (x + tw > window.innerWidth  ? e.clientX - tw - 10 : x) + 'px';
                    tip.style.top  = (y + th > window.innerHeight ? e.clientY - th - 10 : y) + 'px';
                });

                p.addEventListener('mouseleave', () => {
                    if (window.matchMedia('(pointer: coarse)').matches) return;
                    document.getElementById('tooltip').style.display = 'none';
                });

                p.addEventListener('click', async (e) => {
                    if (window._panMoved > 12) return;
                    if (!p.id) return;
                    e.stopPropagation();

                    if (window.matchMedia('(pointer: coarse)').matches) {
                        // ── MÓVIL ──
                        const tip = document.getElementById('tooltip');
                        const yaAbierto = tip.classList.contains('mobile-tip') && tip.dataset.loteId === p.id;

                        // Siempre cerrar tooltip anterior primero
                        tip.style.display = 'none';
                        tip.classList.remove('mobile-tip');
                        restoreHighlight();

                        if (yaAbierto) return; // segundo toque en mismo lote = cerrar

                        // Construir contenido
                        const d = window._votosData && window._votosData[p.id];
                        const v = d ? (d.voto || '').toUpperCase() : '';
                        const estado = v === 'SI' ? '🟢 SÍ quiere pavimento'
                                     : v === 'NO' ? '🔴 NO quiere pavimento'
                                     : '⚪ Sin respuesta';
                        tip.innerHTML =
                            'Nombre: <b>' + (d && d.nombre   || '—') + '</b><br>' +
                            'Dirección: <b>' + (d && d.direccion || '—') + '</b><br>' +
                            'Teléfono: <b>' + (d && d.telefono || '—') + '</b><br>' +
                            estado +
                            '<button class="tip-edit-btn" data-lote="' + p.id + '" onclick="abrirModal(this.dataset.lote)">Editar</button>';
                        tip.dataset.loteId = p.id;
                        tip.classList.add('mobile-tip');

                        // Posicionar cerca del polígono
                        tip.style.display = 'block';
                        const rect = p.getBoundingClientRect();
                        const tipH = tip.offsetHeight, tipW = tip.offsetWidth;
                        let topPos = rect.top - tipH - 10;
                        if (topPos < 60) topPos = rect.bottom + 10;
                        let leftPos = rect.left + rect.width / 2 - tipW / 2;
                        leftPos = Math.max(8, Math.min(leftPos, window.innerWidth - tipW - 8));
                        tip.style.top  = topPos + 'px';
                        tip.style.left = leftPos + 'px';
                        tip.style.transform = 'none';
                        highlightPath(p);

                    } else {
                        // ── PC: abrir modal directo ──
                        highlightPath(p);
                        seleccionado = p.id;
                        document.getElementById('nombre').value    = '';
                        document.getElementById('direccion').value = '';
                        document.getElementById('telefono').value  = '';
                        document.getElementById('voto-select').value = 'NC';
                        const { data } = await _supabase
                            .from('votos').select('*').eq('lote_id', p.id).maybeSingle();
                        if (data) {
                            if (data.nombre)    document.getElementById('nombre').value    = data.nombre;
                            if (data.direccion) document.getElementById('direccion').value = data.direccion;
                            if (data.telefono)  document.getElementById('telefono').value  = data.telefono;
                            const v = (data.voto || '').toUpperCase();
                            document.getElementById('voto-select').value =
                                (v === 'SI' || v === 'NO') ? v : 'NC';
                        }
                        document.getElementById('tooltip').style.display = 'none';
                        document.getElementById('modal').style.display = 'flex';
                    }
                });
            });
        }

        async function abrirModal(loteId) {
            // Cerrar tooltip
            const tip = document.getElementById('tooltip');
            tip.style.display = 'none';
            tip.classList.remove('mobile-tip');
            seleccionado = loteId;
            const p = document.getElementById(loteId);
            if (p) highlightPath(p);
            document.getElementById('nombre').value    = '';
            document.getElementById('direccion').value = '';
            document.getElementById('telefono').value  = '';
            document.getElementById('voto-select').value = 'NC';
            const d = window._votosData && window._votosData[loteId];
            if (d) {
                if (d.nombre)    document.getElementById('nombre').value    = d.nombre;
                if (d.direccion) document.getElementById('direccion').value = d.direccion;
                if (d.telefono)  document.getElementById('telefono').value  = d.telefono;
                const v = (d.voto || '').toUpperCase();
                document.getElementById('voto-select').value = (v === 'SI' || v === 'NO') ? v : 'NC';
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
            const tip = document.getElementById('tooltip');
            tip.style.display = 'none';
            tip.classList.remove('mobile-tip');
            restoreHighlight();
        }

        function abrirWhatsapp() {
            const tel = document.getElementById('telefono').value.trim();
            const digitos = tel.replace(/\D/g, '');
            if (!digitos) {
                alert('Cargá un teléfono primero.');
                return;
            }
            window.open('https://api.whatsapp.com/send?phone=+54' + digitos, '_blank');
        }

        async function guardar() {
            const nombre    = document.getElementById('nombre').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const tel       = document.getElementById('telefono').value.trim();
            const valor     = document.getElementById('voto-select').value;

            const { error } = await _supabase.from('votos').upsert(
                { lote_id: seleccionado, nombre, direccion, telefono: tel, voto: valor },
                { onConflict: 'lote_id' }
            );
            if (error) { alert('Error al guardar: ' + error.message); return; }
            cerrarModal();
            cargarVotos();
        }

        function destacarLoteDesdeHistorial(loteId) {
            const path = document.getElementById(loteId);
            if (!path) {
                // Reintentar en 500ms (el SVG puede no estar listo)
                setTimeout(() => destacarLoteDesdeHistorial(loteId), 500);
                return;
            }

            // Centrar el mapa en el lote
            const container = document.getElementById('map-container');
            const inner     = document.getElementById('map-inner');
            const rect      = path.getBoundingClientRect();
            const cRect     = container.getBoundingClientRect();

            // Aplicar clase de destaque
            path.classList.add('lote-from-historial');

            // Mostrar banner
            const data = window._votosData && window._votosData[loteId];
            const banner = document.getElementById('lote-banner');
            banner.innerHTML =
                '📍 Lote: <b>' + loteId + '</b>' +
                (data && data.nombre ? ' — ' + data.nombre : '') +
                '&nbsp;&nbsp;<span style="font-weight:400;font-size:0.8rem">✕ cerrar</span>';
            banner.style.display = 'block';

            // Auto-ocultar banner después de 8 segundos
            setTimeout(() => { banner.style.display = 'none'; }, 8000);
        }

        // ── ZOOM + PAN ────────────────────────────────────────────────
        function initZoom() {
            const container = document.getElementById('map-container');
            const inner     = document.getElementById('map-inner');
            const svg       = inner.querySelector('svg');

            // Read intrinsic SVG size from viewBox
            const vb = svg && svg.viewBox.baseVal;
            let svgW = vb && vb.width  > 0 ? vb.width  : 800;
            let svgH = vb && vb.height > 0 ? vb.height : 600;

            // Set explicit px size on SVG so transforms work predictably
            svg.setAttribute('width',  svgW);
            svg.setAttribute('height', svgH);
            svg.style.width  = svgW + 'px';
            svg.style.height = svgH + 'px';

            let scale = 1, ox = 0, oy = 0;

            // ── Compute initial scale: fit entire SVG in container ──
            function computeInitial() {
                const cr = container.getBoundingClientRect();
                const byH = cr.height / svgH;
                const byW = cr.width  / svgW;
                scale = Math.min(byH, byW);
                ox = (cr.width  - svgW * scale) / 2;
                oy = (cr.height - svgH * scale) / 2;
                apply();
            }

            function apply() {
                inner.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
            }

            // MIN scale: ~16.7% of screen height = triple zoom-out vs 50%
            function getMinScale() {
                const cr = container.getBoundingClientRect();
                return (cr.height * 0.167) / svgH;
            }

            // No position clamping — free pan
            computeInitial();

            // ── Mouse wheel zoom ──
            container.addEventListener('wheel', e => {
                e.preventDefault();
                const r  = container.getBoundingClientRect();
                const mx = e.clientX - r.left;
                const my = e.clientY - r.top;
                const MIN = getMinScale();
                const ns  = Math.min(36, Math.max(MIN, scale * (e.deltaY > 0 ? 0.85 : 1.18)));
                const rt  = ns / scale;
                ox = mx - rt * (mx - ox);
                oy = my - rt * (my - oy);
                scale = ns;
                apply();
            }, { passive: false });

            // ── Pointer pan + pinch ──
            // We track total movement in window._panMoved so path clicks can check it.
            const pts = new Map();
            let panStart   = null;
            window._panMoved = 0;

            container.addEventListener('pointerdown', e => {
                // Do NOT call setPointerCapture — that would steal events from paths
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                window._panMoved = 0;
                if (pts.size === 1) {
                    panStart = { x: e.clientX, y: e.clientY, ox, oy };
                }
                if (pts.size === 2) {
                    container._pinch = getPinch();
                }
                container.classList.add('grabbing');
            });

            container.addEventListener('pointermove', e => {
                if (!pts.has(e.pointerId)) return;
                const prev = pts.get(e.pointerId);
                window._panMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

                // Cerrar tooltip móvil en cuanto se detecta desplazamiento real
                if (window._panMoved > 12) {
                    const tip = document.getElementById('tooltip');
                    if (tip.classList.contains('mobile-tip')) {
                        tip.style.display = 'none';
                        tip.classList.remove('mobile-tip');
                        restoreHighlight();
                    }
                }

                if (pts.size === 2) {
                    const p0 = container._pinch;
                    if (!p0) return;
                    const curr = getPinch();
                    const MIN  = getMinScale();
                    const rt   = curr.dist / p0.dist;
                    const ns   = Math.min(36, Math.max(MIN, scale * rt));
                    const r2   = ns / scale;
                    ox = curr.mx - r2 * (curr.mx - ox) + (curr.mx - p0.mx);
                    oy = curr.my - r2 * (curr.my - oy) + (curr.my - p0.my);
                    scale = ns;
                    container._pinch = curr;
                    apply();
                } else if (pts.size === 1 && panStart) {
                    ox = panStart.ox + (e.clientX - panStart.x);
                    oy = panStart.oy + (e.clientY - panStart.y);
                    apply();
                }
            });

            const endPointer = e => {
                pts.delete(e.pointerId);
                container._pinch = null;
                if (pts.size === 1) {
                    const [pt] = pts.values();
                    panStart = { x: pt.x, y: pt.y, ox, oy };
                } else if (pts.size === 0) {
                    panStart = null;
                    container.classList.remove('grabbing');
                    // Reset _panMoved shortly after so the click event can fire first
                    setTimeout(() => { window._panMoved = 0; }, 100);
                }
            };
            container.addEventListener('pointerup',     endPointer);
            container.addEventListener('pointercancel', endPointer);

            function getPinch() {
                const [a, b] = [...pts.values()];
                const r  = container.getBoundingClientRect();
                const dx = b.x - a.x, dy = b.y - a.y;
                return {
                    dist: Math.sqrt(dx*dx + dy*dy),
                    mx: ((a.x + b.x) / 2) - r.left,
                    my: ((a.y + b.y) / 2) - r.top,
                };
            }

            container.style.touchAction = 'none';

            // ── Cerrar tooltip móvil al tocar fuera de un polígono ──
            container.addEventListener('click', (e) => {
                if (window._panMoved > 12) return;
                // Si el click fue en un path, los clicks de polígono lo manejan
                if (e.target.tagName === 'path') return;
                const tip = document.getElementById('tooltip');
                if (tip.classList.contains('mobile-tip')) {
                    tip.style.display = 'none';
                    tip.classList.remove('mobile-tip');
                    restoreHighlight();
                }
            });
        }
    </script>
</body>
</html>
