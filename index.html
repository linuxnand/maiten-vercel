<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavimento Barrio El Maitén</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── STICKY HEADER ── */
        #header {
            flex-shrink: 0;
            background: #16213e;
            color: white;
            text-align: center;
            padding: 10px 12px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }
        #header h1 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #e0e0e0;
        }
        #stats {
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .stat-si  { color: #2ecc71; }
        .stat-no  { color: #e74c3c; }
        .stat-nc  { color: #bdc3c7; }
        .stat-val { color: white; }
        .stat-pct {
            color: white;
            background: rgba(255,255,255,0.18);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 0.8em;
        }

        /* ── MAP AREA ── */
        #map-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #f0f2f5;
        }
        #map-inner {
            transform-origin: 0 0;
            cursor: grab;
            width: 100%;
        }
        #map-inner:active { cursor: grabbing; }
        svg { width: 100%; height: auto; display: block; }
        path { cursor: pointer; transition: fill 0.2s; stroke: #333; stroke-width: 0.5px; }
        path:hover { opacity: 0.75; }
        .lote-si { fill: #2ecc71 !important; }
        .lote-no { fill: #e74c3c !important; }
        .lote-nc { fill: #bdc3c7 !important; }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 22px 20px 18px;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
        }
        .modal-content h2 { font-size: 1.1rem; margin-bottom: 4px; color: #222; }
        #lote-info { font-size: 0.85rem; color: #666; margin-bottom: 12px; min-height: 18px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        /* SÍ | NO | NC on one row */
        .btns-main {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btns-main button {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: white;
        }
        .btn-si { background: #2ecc71; }
        .btn-no { background: #e74c3c; }
        .btn-nc { background: #95a5a6; }
        .btn-cancel {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            background: #e0e0e0;
            color: #444;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Pavimento Barrio El Maitén</h1>
        <div id="stats">Cargando...</div>
    </div>

    <div id="map-container">
        <div id="map-inner"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="lote-titulo">Lote</h2>
            <div id="lote-info"></div>
            <input type="text" id="nombre" placeholder="Nombre y Apellido">
            <input type="tel"  id="telefono" placeholder="Teléfono">
            <div class="btns-main">
                <button class="btn-si" onclick="votar('SI')">SÍ</button>
                <button class="btn-no" onclick="votar('NO')">NO</button>
                <button class="btn-nc" onclick="votar('NC')">NC</button>
            </div>
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const SB_URL = 'https://jhevntzswmuwxpcqvdje.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZXZudHpzd211d3hwY3F2ZGplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNTE0NzAsImV4cCI6MjA4NjkyNzQ3MH0.i4Xn1TA9knS1a_3_3AoTrobfEg549kBf7iSK9E4Pj3g';
        const _supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let seleccionado = null;

        // ── LOAD SVG ─────────────────────────────────────────────────
        fetch('mapa.svg')
            .then(r => { if (!r.ok) throw new Error("No se pudo cargar mapa.svg."); return r.text(); })
            .then(data => {
                document.getElementById('map-inner').innerHTML = data;
                escucharClicks();
                cargarVotos();
                initZoom();
            })
            .catch(err => { document.getElementById('stats').innerText = "❌ " + err.message; });

        // ── LOAD VOTES ────────────────────────────────────────────────
        async function cargarVotos() {
            const { data, error } = await _supabase.from('votos').select('*');
            if (error) { console.error(error); return; }

            let si = 0, no = 0, nc = 0;
            document.querySelectorAll('#map-inner path').forEach(p => p.setAttribute('class', 'lote-nc'));

            data.forEach(item => {
                const el = document.getElementById(item.lote_id);
                if (el) {
                    const v = (item.voto || '').toUpperCase();
                    if (v === 'SI')      { el.setAttribute('class', 'lote-si'); si++; }
                    else if (v === 'NO') { el.setAttribute('class', 'lote-no'); no++; }
                    else                 { el.setAttribute('class', 'lote-nc'); nc++; }
                }
            });

            const total = si + no;
            const pctSi = total ? Math.round(si / total * 100) : 0;
            const pctNo = total ? Math.round(no / total * 100) : 0;

            document.getElementById('stats').innerHTML =
                `<span class="stat-si">SÍ: <span class="stat-val">${si}</span> <span class="stat-pct">${pctSi}%</span></span>` +
                `<span class="stat-no">NO: <span class="stat-val">${no}</span> <span class="stat-pct">${pctNo}%</span></span>` +
                `<span class="stat-nc">NC: <span class="stat-val">${nc}</span></span>`;
        }

        // ── CLICKS ───────────────────────────────────────────────────
        function escucharClicks() {
            document.querySelectorAll('#map-inner path').forEach(p => {
                p.onclick = async () => {
                    if (!p.id) return;
                    seleccionado = p.id;
                    document.getElementById('lote-titulo').innerText = "Lote: " + p.id;
                    document.getElementById('nombre').value = '';
                    document.getElementById('telefono').value = '';
                    document.getElementById('lote-info').innerText = 'Cargando...';

                    const { data } = await _supabase.from('votos').select('*').eq('lote_id', p.id).maybeSingle();
                    if (data) {
                        const v = (data.voto || '').toUpperCase();
                        const estado = v === 'SI' ? '🟢 SÍ' : v === 'NO' ? '🔴 NO' : '⚪ Sin respuesta';
                        document.getElementById('lote-info').innerText =
                            estado +
                            (data.nombre   ? ' · ' + data.nombre   : '') +
                            (data.telefono ? ' · ' + data.telefono : '');
                        if (data.nombre)   document.getElementById('nombre').value   = data.nombre;
                        if (data.telefono) document.getElementById('telefono').value = data.telefono;
                    } else {
                        document.getElementById('lote-info').innerText = 'Sin datos registrados';
                    }

                    document.getElementById('modal').style.display = 'flex';
                };
            });
        }

        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }

        async function votar(valor) {
            const nombre = document.getElementById('nombre').value.trim();
            const tel    = document.getElementById('telefono').value.trim();
            if (!nombre && valor !== 'NC') return alert("Por favor ingresa tu nombre");

            const { error } = await _supabase.from('votos').upsert(
                { lote_id: seleccionado, nombre, telefono: tel, voto: valor },
                { onConflict: 'lote_id' }
            );

            if (error) { alert("Error al guardar: " + error.message); }
            else { alert("¡Registro guardado!"); cerrarModal(); cargarVotos(); }
        }

        // ── ZOOM + PAN (Pointer Events — no jump on finger lift) ─────
        function initZoom() {
            const container = document.getElementById('map-container');
            const inner     = document.getElementById('map-inner');
            let scale = 1, ox = 0, oy = 0;
            const MIN = 1, MAX = 6;

            function apply() {
                inner.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
            }
            function clamp() {
                const r  = container.getBoundingClientRect();
                const sw = r.width * scale;
                const sh = inner.offsetHeight * scale;
                ox = Math.min(0, Math.max(r.width  - sw, ox));
                oy = Math.min(0, Math.max(r.height - sh, oy));
            }

            // Mouse wheel
            container.addEventListener('wheel', e => {
                e.preventDefault();
                const r  = container.getBoundingClientRect();
                const mx = e.clientX - r.left;
                const my = e.clientY - r.top;
                const ns = Math.min(MAX, Math.max(MIN, scale * (e.deltaY > 0 ? 0.85 : 1.18)));
                const rt = ns / scale;
                ox = mx - rt * (mx - ox);
                oy = my - rt * (my - oy);
                scale = ns;
                clamp(); apply();
            }, { passive: false });

            // Pointer-based pan + pinch (no jump when finger lifts)
            const pts = new Map(); // pointerId → {x, y}
            let panStart = null;   // {x, y, ox, oy} — set when 1 pointer active

            container.addEventListener('pointerdown', e => {
                container.setPointerCapture(e.pointerId);
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pts.size === 1) {
                    panStart = { x: e.clientX, y: e.clientY, ox, oy };
                }
                // When second finger arrives, reset pinch baseline (no jump)
                if (pts.size === 2) {
                    container._pinch = getPinch();
                }
            });

            container.addEventListener('pointermove', e => {
                if (!pts.has(e.pointerId)) return;
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (pts.size === 2) {
                    const prev = container._pinch;
                    if (!prev) return;
                    const curr = getPinch();
                    const rt   = (curr.dist / prev.dist);
                    const ns   = Math.min(MAX, Math.max(MIN, scale * rt));
                    const r2   = ns / scale;
                    ox = curr.mx - r2 * (curr.mx - ox) + (curr.mx - prev.mx);
                    oy = curr.my - r2 * (curr.my - oy) + (curr.my - prev.my);
                    scale = ns;
                    container._pinch = curr;
                    clamp(); apply();

                } else if (pts.size === 1 && panStart) {
                    ox = panStart.ox + (e.clientX - panStart.x);
                    oy = panStart.oy + (e.clientY - panStart.y);
                    clamp(); apply();
                }
            });

            const endPointer = e => {
                pts.delete(e.pointerId);
                container._pinch = null;
                if (pts.size === 1) {
                    // One finger remaining — anchor pan at current position (no jump)
                    const [pt] = pts.values();
                    panStart = { x: pt.x, y: pt.y, ox, oy };
                } else if (pts.size === 0) {
                    panStart = null;
                }
            };
            container.addEventListener('pointerup',     endPointer);
            container.addEventListener('pointercancel', endPointer);

            function getPinch() {
                const [a, b] = [...pts.values()];
                const r = container.getBoundingClientRect();
                const dx = b.x - a.x, dy = b.y - a.y;
                return {
                    dist: Math.sqrt(dx*dx + dy*dy),
                    mx: ((a.x + b.x) / 2) - r.left,
                    my: ((a.y + b.y) / 2) - r.top,
                };
            }

            container.style.touchAction = 'none';
        }
    </script>
</body>
</html>
